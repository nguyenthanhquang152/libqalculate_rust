[package]
name = "libqalculate_rust"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[workspace]
members = ["."]
exclude = ["fuzz"]

[dependencies]
cxx = "1.0"
rug = { version = "1.24", features = ["integer", "rational", "float", "complex"] }

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"
cxx-build = "1.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.9.0"
tempfile = "3.23.0"

[[bin]]
name = "qalc-rs"
path = "src/main.rs"
